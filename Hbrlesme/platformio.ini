[env:genericSTM32G431CB]
platform = ststm32
board = genericSTM32G431CB
framework = arduino
lib_deps = 
	adafruit/Adafruit BME280 Library@^2.3.0
	adafruit/Adafruit BNO055@^1.6.4
	xreef/EByte LoRa E22 library@^1.0.9
	mikalhart/TinyGPSPlus@^1.1.0
	jgromes/RadioLib@^7.6.0
